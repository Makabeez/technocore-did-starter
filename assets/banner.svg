<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="technocore-did-starter">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1128"/>
      <stop offset="55%" stop-color="#0D1734"/>
      <stop offset="100%" stop-color="#060B1C"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4CC9F0" stop-opacity="0"/>
      <stop offset="50%" stop-color="#4CC9F0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#4CC9F0" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="-1 0; 1 0; -1 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#sweep)"/>

  <!-- grid -->
  <g stroke="#4CC9F0" stroke-opacity="0.07" stroke-width="1">
    <path d="M0 60h1200M0 120h1200M0 180h1200M0 240h1200"/>
    <path d="M150 0v300M300 0v300M450 0v300M600 0v300M750 0v300M900 0v300M1050 0v300"/>
  </g>

  <!-- ephemeral lane: nodes that fade out -->
  <g>
    <text x="72" y="96" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13"
          fill="#7C8DB5" letter-spacing="2">ROOM · EPHEMERAL · 7d RING</text>
    <g fill="#F25F5C">
      <circle cx="76" cy="128" r="6">
        <animate attributeName="opacity" values="1;1;0" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="116" cy="128" r="6">
        <animate attributeName="opacity" values="1;1;0" dur="4s" begin="0.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="156" cy="128" r="6">
        <animate attributeName="opacity" values="1;1;0" dur="4s" begin="1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="196" cy="128" r="6">
        <animate attributeName="opacity" values="1;1;0" dur="4s" begin="1.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- durable lane: nodes that persist and pulse -->
    <text x="72" y="188" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13"
          fill="#7C8DB5" letter-spacing="2">NOTE · DURABLE · SIGNED</text>
    <g fill="#4CC9F0" filter="url(#glow)">
      <circle cx="76" cy="220" r="6">
        <animate attributeName="r" values="6;7.5;6" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="116" cy="220" r="6">
        <animate attributeName="r" values="6;7.5;6" dur="3s" begin="0.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="156" cy="220" r="6">
        <animate attributeName="r" values="6;7.5;6" dur="3s" begin="0.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="196" cy="220" r="6">
        <animate attributeName="r" values="6;7.5;6" dur="3s" begin="1.2s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- wordmark -->
  <text x="330" y="146" font-family="ui-sans-serif,Inter,Helvetica,Arial,sans-serif"
        font-size="58" font-weight="700" fill="#F5F8FF" letter-spacing="-1">
    technocore-did-starter
  </text>
  <text x="332" y="188" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
        font-size="18" fill="#4CC9F0" letter-spacing="1">
    a signed identity, and a record that outlives the room
  </text>
  <rect x="332" y="208" width="0" height="2" fill="#4CC9F0" opacity="0.8">
    <animate attributeName="width" values="0;520;520;0" dur="7s" repeatCount="indefinite"/>
  </rect>

  <text x="1128" y="272" text-anchor="end"
        font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12"
        fill="#5A6B93" letter-spacing="1">technocore.chat · did:key · Ed25519</text>
</svg>
